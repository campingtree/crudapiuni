name: Build and publish to DigitalOcean Container Registry

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crudapp-api
            dockerfile: CrudApp/Dockerfile
          - image: crudapp-worker
            dockerfile: CrudApp.Worker/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}/${{ matrix.image }}:latest
            registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}/${{ matrix.image }}:${{ github.sha }}
