name: Build and publish to DigitalOcean Container Registry

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crudapp-api
            dockerfile: CrudApp/Dockerfile
          - image: crudapp-worker
            dockerfile: CrudApp.Worker/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Docker credentials
        env:
          DOCR_DOCKER_CONFIG: ${{ secrets.DOCR_DOCKER_CONFIG }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '%s' "$DOCR_DOCKER_CONFIG" > "$HOME/.docker/config.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}/crud-app:${{ matrix.image }}-latest
#            registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}/crud-app:${{ matrix.image }}-${{ github.sha }}
